services:
  postgres:
    image: postgres:17
    container_name: achaqui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: achaqui
      POSTGRES_PASSWORD: achaqui_dev
      POSTGRES_DB: achaqui
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U achaqui -d achaqui"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: